# EduPortal IELTS reverse proxy: one origin for web + API, so the session
# cookie stays first-party.
upstream ielts_web { server web:3200; }
upstream ielts_api { server api:4002; }

server {
  listen 80;
  server_name _;
  # IELTS Test Packages carry base64 audio (MAX_PACKAGE_MB in the API).
  client_max_body_size 130m;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  # The Speaking test records the candidate's microphone on this origin only.
  add_header Permissions-Policy "microphone=(self), camera=()" always;

  location /api/ {
    rewrite ^/api/(.*) /$1 break;
    proxy_pass http://ielts_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    # Listening audio is streamed with Range requests.
    proxy_force_ranges on;
  }

  location / {
    proxy_pass http://ielts_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
